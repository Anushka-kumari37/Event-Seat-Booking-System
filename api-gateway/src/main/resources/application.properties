spring.application.name=api-gateway

server.port=8080




# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# User Service
spring.cloud.gateway.server.webflux.routes[0].id=user-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://user-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/user/**

# Item Service
spring.cloud.gateway.server.webflux.routes[1].id=event-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://event-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/events/**

#Claim Service
spring.cloud.gateway.server.webflux.routes[2].id=seat-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://seat-service
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/seats/**

#Booking Service
spring.cloud.gateway.server.webflux.routes[3].id=booking-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://booking-service
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/booking/**

#Payment Service
spring.cloud.gateway.server.webflux.routes[4].id=payment-service
spring.cloud.gateway.server.webflux.routes[4].uri=lb://payment-service
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/payment/**

#Notification Service
spring.cloud.gateway.server.webflux.routes[5].id=notification-service
spring.cloud.gateway.server.webflux.routes[5].uri=lb://notification-service
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/api/notification/**



logging.level.org.springframework.cloud.gateway=DEBUG

spring.cloud.gateway.discovery.locator.lower-case-service-id=true